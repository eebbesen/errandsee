<svg width="920" height="760" viewBox="0 0 920 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Saint Paul transit and grocery map, Snelling to Western, Randolph to University</title>
<desc>A Lschematic map of Metro Transit routes bounded by Snelling Avenue on the west, Western Avenue on the east, Randolph Avenue on the south, and University Avenue on the north.</desc>

<defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .tline { font-size: 10px; font-weight: 600; fill: #ffffff; letter-spacing: 0.3px; }
  .streetlabel { font-size: 10px; font-weight: 500; fill: #4b5563; letter-spacing: 0.5px; }
  .title { font-size: 16px; font-weight: 500; fill: #111827; }
  .subtitle { font-size: 12px; font-weight: 400; fill: #4b5563; }
  .grocery-name { font-size: 10px; font-weight: 600; fill: #000000; }
  .grocery-leader { stroke: #9ca3af; stroke-width: 0.5; stroke-dasharray: 2 2; fill: none; }
  .key-label { font-size: 11px; font-weight: 400; fill: #111827; }
  .key-heading { font-size: 11px; font-weight: 600; fill: #4b5563; letter-spacing: 0.8px; }
</style>
</defs>

<rect width="920" height="760" fill="#ffffff"></rect>

<!-- Title -->
<text class="title" x="40" y="42">Transit to groceries</text>
<text class="subtitle" x="40" y="60">Snelling to Western · Randolph to University</text>

<!-- Boundary frame -->
<line x1="40" y1="110" x2="880" y2="110"></line>
<line x1="40" y1="650" x2="880" y2="650"></line>
<line x1="80" y1="110" x2="80" y2="650"></line>
<line x1="880" y1="110" x2="880" y2="650"></line>

<!-- Route lines -->
<line x1="120" y1="303" x2="850" y2="303" stroke="#E91E63" stroke-width="5" stroke-linecap="round"></line>
<line x1="120" y1="310" x2="850" y2="310" stroke="#0078C9" stroke-width="7" stroke-linecap="round"></line>
<line x1="720" y1="150" x2="720" y2="610" stroke="#00A0AF" stroke-width="5" stroke-linecap="round"></line>
<line x1="420" y1="150" x2="420" y2="610" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"></line>
<line x1="120" y1="150" x2="120" y2="610" stroke="#FFC424" stroke-width="7" stroke-linecap="round"></line>
<line x1="120" y1="150" x2="850" y2="150" stroke="#00843D" stroke-width="7" stroke-linecap="round"></line>
<line x1="120" y1="470" x2="850" y2="470" stroke="#F26822" stroke-width="6" stroke-linecap="round"></line>
<line x1="120" y1="610" x2="850" y2="610" stroke="#7B519C" stroke-width="6" stroke-linecap="round"></line>

<!-- Grocery stores - amber with dark outline -->
<circle cx="270" cy="150" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="420" cy="150" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="500" cy="150" r="4" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.1"></circle>
<circle cx="570" cy="150" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="605" cy="150" r="4" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.1"></circle>
<circle cx="720" cy="150" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="780" cy="150" r="4" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.1"></circle>
<circle cx="850" cy="150" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="120" cy="310" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="720" cy="310" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="270" cy="470" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="570" cy="470" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="270" cy="610" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>
<circle cx="420" cy="610" r="4.5" fill="#F9C846" stroke="#1a1a1a" stroke-width="1.2"></circle>

