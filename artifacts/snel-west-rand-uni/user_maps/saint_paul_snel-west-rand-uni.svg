<!-- Grocery labels - RANDOLPH AVE -->
<line x1="270" y1="602" x2="270" y2="565" class="grocery-leader"></line>
<rect x="232" y="545" width="80" height="20" rx="3" fill="#F9C846" stroke="#8B6914" stroke-width="0.7"></rect>
<text class="grocery-name" x="272" y="559" text-anchor="middle">Oxendale's</text>

<line x1="420" y1="602" x2="420" y2="565" class="grocery-leader"></line>
