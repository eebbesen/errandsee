<script>
  document.querySelectorAll('[data-route]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      const route = el.dataset.route;
      document.querySelectorAll(`[data-route="${route}"]`).forEach(e => e.classList.add('route-active'));
    });
    el.addEventListener('mouseleave', () => {
      const route = el.dataset.route;
      document.querySelectorAll(`[data-route="${route}"]`).forEach(e => e.classList.remove('route-active'));
    });
  });

  const freqTooltip = document.getElementById('freq-tooltip');
  const tooltipShowDelayMs = 250;
  let tooltipTimer;

  const hideFreqTooltip = () => {
    clearTimeout(tooltipTimer);
    if (!freqTooltip) return;
    freqTooltip.classList.remove('is-visible');
    freqTooltip.setAttribute('aria-hidden', 'true');
  };

  const moveFreqTooltip = event => {
    if (!freqTooltip) return;
    freqTooltip.style.left = `${event.clientX}px`;
    freqTooltip.style.top = `${event.clientY}px`;
  };

  const scheduleFreqTooltip = (label, event) => {
    clearTimeout(tooltipTimer);
    if (!freqTooltip) return;
    freqTooltip.textContent = label;
    moveFreqTooltip(event);
    tooltipTimer = setTimeout(() => {
      freqTooltip.classList.add('is-visible');
      freqTooltip.setAttribute('aria-hidden', 'false');
    }, tooltipShowDelayMs);
  };

  document.querySelectorAll('.freq-badge').forEach(badge => {
    const valueEl = badge.querySelector('.freq-value');
    if (!valueEl) return;

    const minutesLabel = `${valueEl.textContent.trim()} minutes`;
    badge.setAttribute('aria-label', minutesLabel);

    const existingTitle = badge.querySelector('title');
    if (existingTitle) existingTitle.remove();

    badge.addEventListener('mouseenter', event => scheduleFreqTooltip(minutesLabel, event));
    badge.addEventListener('mousemove', moveFreqTooltip);
    badge.addEventListener('mouseleave', hideFreqTooltip);
  });
</script>
