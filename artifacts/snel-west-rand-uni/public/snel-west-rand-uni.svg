<svg viewBox="0 0 920 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saint Paul transit and grocery map, Snelling to Western, University to Randolph">
<desc>A schematic map of Metro Transit routes bounded by Snelling Avenue on the west, Western Avenue on the east, University Avenue on the north, and Randolph Avenue on the south.</desc>

<defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .tline { font-size: 10px; font-weight: 600; fill: #ffffff; letter-spacing: 0.3px; }
  .streetlabel { font-size: 10px; font-weight: 500; fill: #4b5563; letter-spacing: 0.5px; }
  .title { font-size: 16px; font-weight: 500; fill: #111827; }
  .subtitle { font-size: 12px; font-weight: 400; fill: #4b5563; }
  .grocery-name { font-size: 10px; font-weight: 600; fill: #000000; }
  .grocery-leader { stroke: #9ca3af; stroke-width: 0.5; stroke-dasharray: 2 2; fill: none; }
  .key-label { font-size: 11px; font-weight: 400; fill: #111827; }
  .key-heading { font-size: 11px; font-weight: 600; fill: #4b5563; letter-spacing: 0.8px; }
  .route-line { stroke-width: 6; stroke-linecap: round; }
  .route-line:hover { stroke-width: 8.4; cursor: pointer; }
  #route-72:hover .route-line { stroke-width: 8.4; cursor: pointer; }
  .street-line { stroke: #000000; stroke-width: 0.5; }
  .store-point { fill: #F9C846; stroke: #1a1a1a; stroke-width: 1.2; }
  .label-box { fill: #F9C846; stroke: #8B6914; stroke-width: 0.7; }
  .store { cursor: pointer; }
  .store-point, .store-label {
    transition: transform 0.15s ease;
    transform-box: fill-box;
    transform-origin: center;
  }
  .store:hover .store-point,
  .store:hover .store-label { transform: scale(1.4); }
  .store-labels {
    transition: transform 0.15s ease;
    transform-box: fill-box;
    transform-origin: center;
  }
  .store:hover .store-labels { transform: scale(1.4); }
  .store:hover .store-labels .store-label { transform: none; }
  .dl-btn-pdf { fill: #E0E7FF; stroke: #C7D2FE; stroke-width: 1; }
  .dl-btn-pdf:hover { fill: #C7D2FE; }
  .dl-btn-png { fill: #E0E7FF; stroke: #C7D2FE; stroke-width: 1; }
  .dl-btn-png:hover { fill: #C7D2FE; }
  .dl-btn-svg { fill: #E0E7FF; stroke: #C7D2FE; stroke-width: 1; }
  .dl-btn-svg:hover { fill: #C7D2FE; }
  .dl-label-pdf { font-size: 12px; font-weight: 600; fill: #312E81; pointer-events: none; }
  .dl-label-png { font-size: 12px; font-weight: 600; fill: #312E81; pointer-events: none; }
  .dl-label-svg { font-size: 12px; font-weight: 600; fill: #312E81; pointer-events: none; }
  a.dl-link { cursor: pointer; }
  a.dl-link:focus-visible { outline: 3px solid #312E81; outline-offset: 3px; border-radius: 6px; }
</style>
</defs>

<rect width="920" height="760" fill="#ffffff"></rect>

<!-- Title -->
<text class="title" x="40" y="42">Transit to groceries</text>
<text class="subtitle" x="40" y="60">Snelling to Western · University to Randolph</text>

<!-- Download buttons -->




<!-- Boundary frame -->
<line x1="40" y1="110" x2="880" y2="110"></line>
<line x1="40" y1="650" x2="880" y2="650"></line>
<line x1="80" y1="110" x2="80" y2="650"></line>
<line x1="880" y1="110" x2="880" y2="650"></line>

<!-- Street lines - no transit route -->
<line class="street-line" x1="270" y1="150" x2="270" y2="610"></line>
<line class="street-line" x1="570" y1="150" x2="570" y2="610"></line>
<line class="street-line" x1="850" y1="150" x2="850" y2="610"></line>

<!-- Route lines -->
<line class="route-line" x1="120" y1="150" x2="120" y2="610" stroke="#000000"></line> -- #7C5E00 A
<line class="route-line" x1="420" y1="150" x2="420" y2="610" stroke="#B45309"></line> -- #6B4226 83
<line class="route-line" x1="720" y1="150" x2="720" y2="610" stroke="#6B4226"></line> -- #00A0AF 65
<g id="route-72">
<line class="route-line" x1="270" y1="306" x2="850" y2="306" stroke="#E91E63"></line>
<line class="route-line" x1="270" y1="150" x2="270" y2="306" stroke="#E91E63"></line>
</g>
<line class="route-line" x1="120" y1="314" x2="850" y2="314" stroke="#0078C9"></line>
<line class="route-line" x1="120" y1="150" x2="850" y2="150" stroke="#00843D"></line>
<line class="route-line" x1="120" y1="470" x2="850" y2="470" stroke="#00A0AF"></line> -- #B45309 63
<line class="route-line" x1="120" y1="610" x2="850" y2="610" stroke="#7B519C"></line>

<!-- Route number labels -->
<rect x="649" y="143" width="22" height="14" rx="4" fill="#00843D"></rect>
<text x="660" y="154" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">GL</text>

<rect x="112" y="383" width="16" height="14" rx="4" fill="#000000"></rect>
<text x="120" y="394" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">A</text>

<rect x="187" y="307" width="16" height="14" rx="4" fill="#0078C9"></rect>
<text x="195" y="318" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">B</text>

<rect x="259" y="221" width="22" height="14" rx="4" fill="#E91E63"></rect>
<text x="270" y="232" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">72</text>

<rect x="474" y="463" width="22" height="14" rx="4" fill="#00A0AF"></rect>
<text x="485" y="474" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">63</text>

<rect x="409" y="383" width="22" height="14" rx="4" fill="#B45309"></rect>
<text x="420" y="394" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">83</text>

<rect x="709" y="383" width="22" height="14" rx="4" fill="#6B4226"></rect>
<text x="720" y="394" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">65</text>

<rect x="534" y="603" width="22" height="14" rx="4" fill="#7B519C"></rect>
<text x="545" y="614" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">74</text>

<!-- Grocery stores -->
<g class="store">
  <circle class="store-point" cx="270" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="240" y="109" width="60" height="20" rx="3"></rect><text class="grocery-name" x="270" y="123" text-anchor="middle">Target</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="420" cy="150" r="4.5"></circle>
  <g class="store-labels">
    <g class="store-label"><rect class="label-box" x="395" y="109" width="50" height="20" rx="3"></rect><text class="grocery-name" x="420" y="123" text-anchor="middle">ALDI</text></g>
    <g class="store-label"><rect class="label-box" x="370" y="86" width="100" height="20" rx="3"></rect><text class="grocery-name" x="420" y="100" text-anchor="middle">St Paul Halal Mkt</text></g>
  </g>
</g>

<g class="store">
  <circle class="store-point" cx="500" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="468" y="165" width="64" height="20" rx="3"></rect><text class="grocery-name" x="500" y="179" text-anchor="middle">Choua's</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="570" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="534" y="109" width="72" height="20" rx="3"></rect><text class="grocery-name" x="570" y="123" text-anchor="middle">Ashama</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="605" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="565" y="165" width="80" height="20" rx="3"></rect><text class="grocery-name" x="605" y="179" text-anchor="middle">Phil Oriental</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="720" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="682" y="109" width="76" height="20" rx="3"></rect><text class="grocery-name" x="720" y="123" text-anchor="middle">Shuang Hur</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="780" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="748" y="165" width="68" height="20" rx="3"></rect><text class="grocery-name" x="782" y="179" text-anchor="middle">Sun Foods</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="850" cy="150" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="810" y="109" width="80" height="20" rx="3"></rect><text class="grocery-name" x="850" y="123" text-anchor="middle">Mi Linda Tierra</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="120" cy="310" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="84" y="328" width="84" height="20" rx="3"></rect><text class="grocery-name" x="126" y="342" text-anchor="middle">Whole Foods</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="720" cy="310" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="660" y="328" width="120" height="20" rx="3"></rect><text class="grocery-name" x="720" y="342" text-anchor="middle">Mississippi Market</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="270" cy="470" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="232" y="488" width="80" height="20" rx="3"></rect><text class="grocery-name" x="272" y="502" text-anchor="middle">Kowalski's</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="570" cy="470" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="530" y="488" width="80" height="20" rx="3"></rect><text class="grocery-name" x="570" y="502" text-anchor="middle">Golden Fig</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="270" cy="610" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="232" y="573" width="80" height="20" rx="3"></rect><text class="grocery-name" x="272" y="587" text-anchor="middle">Oxendale's</text></g>
</g>

<g class="store">
  <circle class="store-point" cx="420" cy="610" r="4.5"></circle>
  <g class="store-label"><rect class="label-box" x="378" y="573" width="86" height="20" rx="3"></rect><text class="grocery-name" x="422" y="587" text-anchor="middle">Trader Joe's</text></g>
</g>

<!-- Horizontal street labels -->
<text class="streetlabel" x="135" y="137">UNIVERSITY</text>
<text class="streetlabel" x="135" y="288">SELBY</text>
<text class="streetlabel" x="135" y="455">GRAND</text>
<text class="streetlabel" x="135" y="595">RANDOLPH</text>

<!-- Vertical street labels -->
<text class="streetlabel" x="120" y="635" text-anchor="middle">SNELLING</text>
<text class="streetlabel" x="270" y="635" text-anchor="middle">HAMLINE</text>
<text class="streetlabel" x="420" y="635" text-anchor="middle">LEXINGTON</text>
<text class="streetlabel" x="570" y="635" text-anchor="middle">VICTORIA</text>
<text class="streetlabel" x="720" y="635" text-anchor="middle">DALE</text>
<text class="streetlabel" x="850" y="635" text-anchor="middle">WESTERN</text>

<!-- Route key -->
<text class="key-heading" x="40" y="688">ROUTES</text>

<g transform="translate(110, 684)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#00843D"></line>
  <text class="key-label" x="30" y="4">Green Line LRT · University</text>
</g>
<g transform="translate(370, 684)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#000000"></line>
  <text class="key-label" x="30" y="4">A Line BRT · Snelling</text>
</g>
<g transform="translate(620, 684)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#0078C9"></line>
  <text class="key-label" x="30" y="4">B Line BRT · Selby</text>
</g>

<g transform="translate(110, 702)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#00A0AF"></line>
  <text class="key-label" x="30" y="4">Route 63 · Grand</text>
</g>
<g transform="translate(370, 702)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#6B4226"></line>
  <text class="key-label" x="30" y="4">Route 65 · Dale</text>
</g>
<g transform="translate(620, 702)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#E91E63"></line>
  <text class="key-label" x="30" y="4">Route 72 · Selby</text>
</g>

<g transform="translate(110, 720)">
  <line class="route-line" x1="0" y1="0" x2="22" y2="0" stroke="#7B519C"></line>
